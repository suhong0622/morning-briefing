<style>
  #briefing-app {
    --ink: #0A0F1C;
    --panel: #101929;
    --panel-raised: #16213A;
    --hair: #263048;
    --text: #E7EAF3;
    --text-dim: #8C96AE;
    --dawn: #FF9A52;
    --dawn-dim: #7A5333;
    --up: #3DD68C;
    --down: #F2637B;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --serif: 'Fraunces', Georgia, serif;
    --sans: 'Inter', -apple-system, system-ui, sans-serif;

    background: var(--ink);
    color: var(--text);
    font-family: var(--sans);
    border-radius: 14px;
    overflow: hidden;
    position: relative;
    min-height: 640px;
    display: flex;
    flex-direction: column;
  }

  #briefing-app * { box-sizing: border-box; }

  #briefing-app .ticker-strip {
    background: #0D1524;
    border-bottom: 1px solid var(--hair);
    overflow: hidden;
    white-space: nowrap;
    padding: 7px 0;
    flex-shrink: 0;
  }
  #briefing-app .ticker-track {
    display: inline-block;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.02em;
    color: var(--text-dim);
    animation: ticker-scroll 32s linear infinite;
  }
  @keyframes ticker-scroll {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }
  #briefing-app .tk-up { color: var(--up); }
  #briefing-app .tk-down { color: var(--down); }
  #briefing-app .tk-sep { color: var(--hair); margin: 0 14px; }

  #briefing-app .header {
    padding: 22px 28px 18px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-shrink: 0;
    border-bottom: 1px solid var(--hair);
  }
  #briefing-app .header h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 24px;
    margin: 0;
    letter-spacing: -0.01em;
  }
  #briefing-app .header .sun { color: var(--dawn); }
  #briefing-app .header .sub {
    font-size: 12.5px;
    color: var(--text-dim);
    margin-top: 4px;
  }
  #briefing-app .header .clock {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-dim);
  }

  #briefing-app .body {
    display: flex;
    flex: 1;
    min-height: 0;
  }
  @media (max-width: 780px) {
    #briefing-app .body { flex-direction: column; }
  }

  #briefing-app .control-panel {
    width: 400px;
    flex-shrink: 0;
    padding: 22px 24px 24px;
    border-right: 1px solid var(--hair);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  @media (max-width: 780px) {
    #briefing-app .control-panel { width: 100%; border-right: none; border-bottom: 1px solid var(--hair); }
  }

  #briefing-app label.field-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 8px;
    font-weight: 500;
  }
  #briefing-app label.field-label .count {
    font-family: var(--mono);
    color: var(--dawn);
  }

  #briefing-app textarea {
    width: 100%;
    min-height: 84px;
    background: var(--panel);
    border: 1px solid var(--hair);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 13.5px;
    line-height: 1.55;
    padding: 12px 14px;
    resize: vertical;
    outline: none;
    transition: border-color 0.15s ease;
  }
  #briefing-app textarea:focus { border-color: var(--dawn-dim); }
  #briefing-app textarea::placeholder { color: #4A526A; }

  #briefing-app .add-row {
    display: flex;
    gap: 6px;
    margin-top: 8px;
  }
  #briefing-app .add-row button {
    flex: 1;
    background: var(--panel);
    border: 1px dashed var(--hair);
    color: var(--text-dim);
    font-family: var(--sans);
    font-size: 12.5px;
    padding: 9px 8px;
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.12s ease;
  }
  #briefing-app .add-row button:hover { border-color: var(--dawn-dim); color: var(--dawn); }

  #briefing-app .materials-list {
    display: flex;
    flex-direction: column;
    gap: 7px;
    margin-top: 10px;
  }
  #briefing-app .material-card {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    background: var(--panel);
    border: 1px solid var(--hair);
    border-radius: 8px;
    padding: 8px 9px;
  }
  #briefing-app .material-thumb {
    width: 34px; height: 34px;
    border-radius: 5px;
    object-fit: cover;
    flex-shrink: 0;
    background: var(--panel-raised);
  }
  #briefing-app .material-icon {
    width: 34px; height: 34px;
    border-radius: 5px;
    background: var(--panel-raised);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 15px;
  }
  #briefing-app .material-body {
    flex: 1;
    min-width: 0;
  }
  #briefing-app .material-tag {
    font-size: 10.5px;
    color: var(--dawn);
    font-family: var(--mono);
    margin-bottom: 2px;
  }
  #briefing-app .material-snippet {
    font-size: 12px;
    color: var(--text-dim);
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    line-height: 1.4;
  }
  #briefing-app .material-remove {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    padding: 2px 4px;
    flex-shrink: 0;
  }
  #briefing-app .material-remove:hover { color: var(--down); }

  #briefing-app .materials-empty {
    font-size: 12px;
    color: #4A526A;
    padding: 10px 2px;
    line-height: 1.6;
  }

  #briefing-app .seg {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  #briefing-app .seg button {
    flex: 1 1 auto;
    background: var(--panel);
    border: 1px solid var(--hair);
    color: var(--text-dim);
    font-family: var(--sans);
    font-size: 12.5px;
    padding: 9px 10px;
    border-radius: 7px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.12s ease;
  }
  #briefing-app .seg button:hover { border-color: #3A4560; color: var(--text); }
  #briefing-app .seg button.active {
    background: rgba(255, 154, 82, 0.12);
    border-color: var(--dawn);
    color: var(--dawn);
  }

  #briefing-app .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    background: var(--panel);
    border: 1px solid var(--hair);
    border-radius: 8px;
  }
  #briefing-app .toggle-row span { font-size: 13px; color: var(--text); }
  #briefing-app .switch {
    width: 36px; height: 20px;
    background: var(--hair);
    border-radius: 999px;
    position: relative;
    cursor: pointer;
    transition: background 0.15s ease;
    flex-shrink: 0;
  }
  #briefing-app .switch.on { background: var(--dawn-dim); }
  #briefing-app .switch::after {
    content: '';
    position: absolute;
    top: 2px; left: 2px;
    width: 16px; height: 16px;
    background: var(--text-dim);
    border-radius: 50%;
    transition: all 0.15s ease;
  }
  #briefing-app .switch.on::after { left: 18px; background: var(--dawn); }

  #briefing-app .generate-btn {
    margin-top: auto;
    background: var(--dawn);
    color: #1A0E04;
    border: none;
    font-family: var(--sans);
    font-weight: 600;
    font-size: 14px;
    padding: 13px 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: filter 0.12s ease;
  }
  #briefing-app .generate-btn:hover { filter: brightness(1.08); }
  #briefing-app .generate-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  #briefing-app .script-panel {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  #briefing-app .script-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    border-bottom: 1px solid var(--hair);
    flex-shrink: 0;
  }
  #briefing-app .script-toolbar .label {
    font-size: 12px;
    color: var(--text-dim);
    font-family: var(--mono);
  }
  #briefing-app .copy-btn {
    background: transparent;
    border: 1px solid var(--hair);
    color: var(--text-dim);
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-family: var(--sans);
  }
  #briefing-app .copy-btn:hover { border-color: #3A4560; color: var(--text); }

  #briefing-app .script-output {
    flex: 1;
    overflow-y: auto;
    padding: 24px 28px 40px;
  }

  #briefing-app .empty-state {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--text-dim);
    padding: 40px;
    gap: 6px;
  }
  #briefing-app .empty-state .big { font-size: 15px; color: var(--text); font-family: var(--serif); }
  #briefing-app .empty-state .small { font-size: 12.5px; max-width: 280px; line-height: 1.6; }

  #briefing-app .loading-state {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--text-dim);
    font-size: 13px;
  }
  #briefing-app .spinner {
    width: 22px; height: 22px;
    border: 2px solid var(--hair);
    border-top-color: var(--dawn);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #briefing-app .scene {
    border-left: 2px solid var(--hair);
    padding: 2px 0 22px 18px;
    margin-left: 4px;
    position: relative;
  }
  #briefing-app .scene::before {
    content: '';
    position: absolute;
    left: -5px; top: 4px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--dawn);
  }
  #briefing-app .scene-meta {
    display: flex;
    gap: 10px;
    align-items: baseline;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }
  #briefing-app .scene-time {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--dawn);
  }
  #briefing-app .scene-title {
    font-size: 13px;
    color: var(--text-dim);
  }
  #briefing-app .scene-visual {
    font-size: 12.5px;
    color: var(--text-dim);
    background: var(--panel);
    border: 1px solid var(--hair);
    border-radius: 6px;
    padding: 8px 11px;
    margin-bottom: 8px;
    line-height: 1.5;
  }
  #briefing-app .scene-narration {
    font-size: 14.5px;
    line-height: 1.75;
    color: var(--text);
    white-space: pre-wrap;
  }
  #briefing-app .scene-caption {
    margin-top: 8px;
    font-size: 12px;
    color: var(--dawn);
    font-family: var(--mono);
  }

  #briefing-app .error-state {
    color: var(--down);
    font-size: 13px;
    padding: 16px;
    background: rgba(242, 99, 123, 0.08);
    border: 1px solid rgba(242, 99, 123, 0.25);
    border-radius: 8px;
  }

  #briefing-app .titles-block {
    margin-bottom: 26px;
    padding-bottom: 22px;
    border-bottom: 1px solid var(--hair);
  }
  #briefing-app .titles-label {
    font-size: 12px;
    color: var(--text-dim);
    font-family: var(--mono);
    margin-bottom: 10px;
  }
  #briefing-app .title-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 11px 13px;
    background: var(--panel);
    border: 1px solid var(--hair);
    border-radius: 8px;
    margin-bottom: 7px;
    font-size: 14px;
    font-family: var(--serif);
    cursor: pointer;
    transition: border-color 0.12s ease;
  }
  #briefing-app .title-item:hover { border-color: var(--dawn-dim); }
  #briefing-app .title-item .copy-hint {
    font-size: 11px;
    color: var(--dawn);
    font-family: var(--sans);
    flex-shrink: 0;
    opacity: 0;
    transition: opacity 0.12s ease;
  }
  #briefing-app .title-item:hover .copy-hint { opacity: 1; }
</style>

<div id="briefing-app">
  <div class="ticker-strip">
    <div class="ticker-track" id="tickerTrack"></div>
  </div>

  <div class="header">
    <div>
      <h1><span class="sun">☼</span> 모닝브리핑 스크립트</h1>
      <div class="sub">뉴스·차트·캡처를 여러 개 던져두면 알아서 정리해서 대본을 짜드려요</div>
    </div>
    <div class="clock" id="clockNow"></div>
  </div>

  <div class="body">
    <div class="control-panel">
      <div>
        <label class="field-label">
          <span>오늘의 자료</span>
          <span class="count" id="materialCount">0개</span>
        </label>

        <textarea id="textDraft" placeholder="뉴스 한 꼭지, 시황 코멘트, 종목 뉴스 등 텍스트 자료를 붙여넣고 아래 '텍스트 추가'를 눌러주세요"></textarea>
        <div class="add-row">
          <button id="addTextBtn" type="button">＋ 텍스트 추가</button>
          <button id="addImageBtn" type="button">🖼 이미지 추가</button>
        </div>
        <input type="file" id="imageInput" accept="image/*" multiple style="display:none;">

        <div class="materials-list" id="materialsList">
          <div class="materials-empty">아직 추가된 자료가 없어요. 시황 뉴스를 여러 건 붙여넣거나, 차트·기사 캡처 이미지를 추가해보세요. 순서·중복은 신경 쓰지 않아도 알아서 정리해요.</div>
        </div>
      </div>

      <div>
        <label class="field-label">영상 길이</label>
        <div class="seg" id="lengthSeg">
          <button data-val="30초">30초 숏폼</button>
          <button data-val="1분" class="active">1분</button>
          <button data-val="2~3분">2~3분</button>
          <button data-val="5분 이상">5분 이상</button>
        </div>
      </div>

      <div>
        <label class="field-label">톤앤매너</label>
        <div class="seg" id="toneSeg">
          <button data-val="신뢰감 있는 전문 앵커 톤" class="active">전문 앵커</button>
          <button data-val="친근하고 편안한 톤">친근한 톤</button>
          <button data-val="빠르고 활기찬 텐션">활기찬 텐션</button>
        </div>
      </div>

      <div>
        <label class="field-label">플랫폼</label>
        <div class="seg" id="platformSeg">
          <button data-val="유튜브 쇼츠/릴스" class="active">쇼츠·릴스</button>
          <button data-val="유튜브 일반 영상">유튜브</button>
          <button data-val="팟캐스트/오디오">오디오</button>
        </div>
      </div>

      <div class="toggle-row">
        <span>인트로/아웃트로 포함</span>
        <div class="switch on" id="introToggle"></div>
      </div>

      <button class="generate-btn" id="generateBtn">자료 정리해서 스크립트 생성</button>
    </div>

    <div class="script-panel">
      <div class="script-toolbar">
        <span class="label" id="statusLabel">대기 중</span>
        <button class="copy-btn" id="copyBtn" style="display:none;">스크립트 복사</button>
      </div>
      <div class="script-output" id="scriptOutput">
        <div class="empty-state">
          <div class="big">아직 생성된 스크립트가 없어요</div>
          <div class="small">왼쪽에 오늘 다룰 자료(텍스트·이미지)를 여러 개 추가하고, 옵션을 고른 뒤 생성 버튼을 눌러보세요. 정리와 우선순위 판단은 자동으로 처리돼요.</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  // ---------- ticker tape ----------
  const sample = [
    ['KOSPI', '+0.62%', 'up'], ['KOSDAQ', '-0.18%', 'down'], ['삼성전자', '+1.24%', 'up'],
    ['SK하이닉스', '+2.05%', 'up'], ['NASDAQ', '-0.41%', 'down'], ['S&P500', '+0.09%', 'up'],
    ['USD/KRW', '1,342.50', ''], ['WTI', '-0.87%', 'down'], ['2Y 국채', '3.412%', '']
  ];
  function tickerHTML() {
    return sample.map(([n, v, d]) =>
      `<span>${n} <span class="${d ? 'tk-'+d : ''}">${v}</span></span><span class="tk-sep">·</span>`
    ).join('');
  }
  document.getElementById('tickerTrack').innerHTML = tickerHTML() + tickerHTML();

  function updateClock() {
    const now = new Date();
    document.getElementById('clockNow').textContent =
      now.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' }) + '  ' +
      now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
  }
  updateClock();
  setInterval(updateClock, 30000);

  // ---------- segmented controls ----------
  function setupSeg(id) {
    const seg = document.getElementById(id);
    seg.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      [...seg.children].forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  }
  setupSeg('lengthSeg');
  setupSeg('toneSeg');
  setupSeg('platformSeg');
  function getSegValue(id) {
    return document.getElementById(id).querySelector('.active').dataset.val;
  }

  const introToggle = document.getElementById('introToggle');
  introToggle.addEventListener('click', () => introToggle.classList.toggle('on'));

  // ---------- materials basket ----------
  // each material: { id, type: 'text'|'image', text?, mediaType?, data? (base64), name? }
  let materials = [];
  let nextId = 1;

  const materialsList = document.getElementById('materialsList');
  const materialCount = document.getElementById('materialCount');

  function renderMaterials() {
    materialCount.textContent = materials.length + '개';
    if (materials.length === 0) {
      materialsList.innerHTML = `<div class="materials-empty">아직 추가된 자료가 없어요. 시황 뉴스를 여러 건 붙여넣거나, 차트·기사 캡처 이미지를 추가해보세요. 순서·중복은 신경 쓰지 않아도 알아서 정리해요.</div>`;
      return;
    }
    materialsList.innerHTML = materials.map((m, idx) => {
      const thumb = m.type === 'image'
        ? `<img class="material-thumb" src="data:${m.mediaType};base64,${m.data}" alt="자료 이미지">`
        : `<div class="material-icon">📝</div>`;
      const tag = m.type === 'image' ? `이미지 자료 ${idx + 1}` : `텍스트 자료 ${idx + 1}`;
      const snippet = m.type === 'image' ? (m.name || '첨부 이미지') : escapeHtml(m.text);
      return `
        <div class="material-card" data-id="${m.id}">
          ${thumb}
          <div class="material-body">
            <div class="material-tag">${tag}</div>
            <div class="material-snippet">${snippet}</div>
          </div>
          <button class="material-remove" data-remove="${m.id}" type="button">×</button>
        </div>
      `;
    }).join('');
  }

  materialsList.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-remove]');
    if (!btn) return;
    const id = Number(btn.dataset.remove);
    materials = materials.filter(m => m.id !== id);
    renderMaterials();
  });

  document.getElementById('addTextBtn').addEventListener('click', () => {
    const ta = document.getElementById('textDraft');
    const val = ta.value.trim();
    if (!val) return;
    materials.push({ id: nextId++, type: 'text', text: val });
    ta.value = '';
    renderMaterials();
  });

  const imageInput = document.getElementById('imageInput');
  document.getElementById('addImageBtn').addEventListener('click', () => imageInput.click());
  imageInput.addEventListener('change', () => {
    const files = [...imageInput.files];
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = () => {
        const base64 = reader.result.split(',')[1];
        materials.push({
          id: nextId++,
          type: 'image',
          mediaType: file.type || 'image/png',
          data: base64,
          name: file.name
        });
        renderMaterials();
      };
      reader.readAsDataURL(file);
    });
    imageInput.value = '';
  });

  // ---------- generation ----------
  const generateBtn = document.getElementById('generateBtn');
  const scriptOutput = document.getElementById('scriptOutput');
  const statusLabel = document.getElementById('statusLabel');
  const copyBtn = document.getElementById('copyBtn');
  let lastScriptText = '';

  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function renderTitles(titles) {
    if (!titles || titles.length === 0) return '';
    const items = titles.map(t => `
      <div class="title-item" data-copy-title>
        <span>${escapeHtml(t)}</span>
        <span class="copy-hint">클릭해서 복사</span>
      </div>
    `).join('');
    return `
      <div class="titles-block">
        <div class="titles-label">추천 제목 · 클릭하면 복사돼요</div>
        ${items}
      </div>
    `;
  }

  function renderScenes(scenes) {
    return scenes.map(sc => `
      <div class="scene">
        <div class="scene-meta">
          <span class="scene-time">${escapeHtml(sc.time || '')}</span>
          <span class="scene-title">${escapeHtml(sc.title || '')}</span>
        </div>
        ${sc.visual ? `<div class="scene-visual">🎬 ${escapeHtml(sc.visual)}</div>` : ''}
        <div class="scene-narration">${escapeHtml(sc.narration || '')}</div>
        ${sc.caption ? `<div class="scene-caption">자막: ${escapeHtml(sc.caption)}</div>` : ''}
      </div>
    `).join('');
  }

  function renderResult(titles, scenes) {
    scriptOutput.innerHTML = renderTitles(titles) + renderScenes(scenes);
    scriptOutput.querySelectorAll('[data-copy-title]').forEach(el => {
      el.addEventListener('click', () => {
        const text = el.querySelector('span').textContent;
        navigator.clipboard.writeText(text).then(() => {
          const hint = el.querySelector('.copy-hint');
          const original = hint.textContent;
          hint.textContent = '복사됨 ✓';
          hint.style.opacity = '1';
          setTimeout(() => { hint.textContent = original; hint.style.opacity = ''; }, 1200);
        });
      });
    });
  }

  function buildPlainText(titles, scenes) {
    const titlesText = (titles && titles.length)
      ? `추천 제목\n${titles.map(t => '- ' + t).join('\n')}\n\n`
      : '';
    const scenesText = scenes.map(sc =>
      `[${sc.time || ''}] ${sc.title || ''}\n` +
      (sc.visual ? `화면: ${sc.visual}\n` : '') +
      `나레이션: ${sc.narration || ''}\n` +
      (sc.caption ? `자막: ${sc.caption}\n` : '')
    ).join('\n');
    return titlesText + scenesText;
  }

  // 응답이 토큰 한도에 걸려 중간에 끊기는 경우를 대비해, 파싱 가능한 마지막 완성된
  // 씬까지만 살려서 복구한다. 응답 형태는 {"titles": [...], "scenes": [...]}.
  function repairArrayFrom(str, bracketIdx) {
    // str[bracketIdx] === '['. Find the furthest point we can close it validly.
    let inString = false, escape = false, arrDepth = 0, objDepth = 0, lastGoodEnd = -1;
    for (let i = bracketIdx; i < str.length; i++) {
      const ch = str[i];
      if (inString) {
        if (escape) escape = false;
        else if (ch === '\\') escape = true;
        else if (ch === '"') inString = false;
        continue;
      }
      if (ch === '"') { inString = true; continue; }
      if (ch === '[') arrDepth++;
      else if (ch === ']') {
        arrDepth--;
        if (arrDepth === 0) return str.slice(bracketIdx, i + 1); // fully closed already
      } else if (ch === '{') objDepth++;
      else if (ch === '}') {
        objDepth--;
        if (objDepth === 0 && arrDepth === 1) lastGoodEnd = i;
      }
    }
    if (lastGoodEnd === -1) return null;
    return str.slice(bracketIdx, lastGoodEnd + 1) + ']';
  }

  function extractArrayField(raw, key) {
    const keyIdx = raw.indexOf(`"${key}"`);
    if (keyIdx === -1) return null;
    const bracketIdx = raw.indexOf('[', keyIdx);
    if (bracketIdx === -1) return null;
    const jsonStr = repairArrayFrom(raw, bracketIdx);
    if (!jsonStr) return null;
    try {
      return JSON.parse(jsonStr);
    } catch (e) {
      return null;
    }
  }

  function parseResponse(raw) {
    try {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.scenes)) {
        return { titles: parsed.titles || [], scenes: parsed.scenes, truncated: false };
      }
      if (Array.isArray(parsed)) {
        // backward-compatible: plain scenes array, no titles
        return { titles: [], scenes: parsed, truncated: false };
      }
    } catch (e) { /* fall through to repair */ }

    const titles = extractArrayField(raw, 'titles') || [];
    const scenes = extractArrayField(raw, 'scenes');
    if (!scenes || scenes.length === 0) return { titles, scenes: null, truncated: false };
    return { titles, scenes, truncated: true };
  }

  async function generateScript() {
    if (materials.length === 0) {
      scriptOutput.innerHTML = `<div class="error-state">먼저 왼쪽에서 오늘 다룰 자료(텍스트 또는 이미지)를 하나 이상 추가해주세요.</div>`;
      return;
    }

    const length = getSegValue('lengthSeg');
    const tone = getSegValue('toneSeg');
    const platform = getSegValue('platformSeg');
    const includeIntro = introToggle.classList.contains('on');

    generateBtn.disabled = true;
    generateBtn.textContent = '생성 중...';
    statusLabel.textContent = '자료 정리 중';
    copyBtn.style.display = 'none';
    scriptOutput.innerHTML = `<div class="loading-state"><div class="spinner"></div>자료 ${materials.length}건을 읽고 우선순위를 정리하는 중이에요</div>`;

    const systemPrompt = `너는 주식/증권 모닝브리핑 영상의 전문 방송작가 겸 편집장이다.
사용자는 오늘 다룰 자료를 여러 건(텍스트 뉴스, 시황 코멘트, 차트·기사 캡처 이미지 등) 순서 없이 던져줄 것이다.

너의 역할은 단순 나열이 아니라 '정리'다:
1. 모든 자료를 먼저 파악한다. 이미지는 그 안의 숫자, 종목명, 차트 방향, 헤드라인까지 읽어서 반영한다.
2. 중복되거나 서로 겹치는 내용은 하나로 합친다.
3. 모닝브리핑 시청자 입장에서 가장 중요한 순서(지수 흐름 → 주도 테마/종목 → 주요 뉴스/이슈 → 오늘 체크포인트 등)로 재구성한다. 원문에 있던 순서를 그대로 따르지 않아도 된다.
4. 자료들 사이의 인과관계나 맥락(예: 특정 뉴스가 특정 종목 등락의 원인)이 보이면 나레이션에서 자연스럽게 연결해준다.

조건:
- 영상 길이: ${length}
- 톤앤매너: ${tone}
- 플랫폼: ${platform}
- 인트로/아웃트로 포함 여부: ${includeIntro ? '포함' : '미포함 (본론만)'}

또한 자료 내용을 바탕으로, 사람들이 클릭하고 싶어질 만한 영상 제목 후보를 5개 뽑는다.
- 플랫폼 관례에 맞게 작성 (쇼츠·릴스는 짧고 강한 후킹 문구, 유튜브 일반 영상은 검색·클릭을 동시에 고려한 제목).
- 자료 속 가장 임팩트 있는 숫자·이슈·종목명을 활용하되 과장이나 낚시성 거짓 정보는 넣지 않는다.
- 5개는 서로 다른 각도(숫자 강조형, 질문형, 경고/기회형, 종목 중심형, 트렌드 요약형 등)로 다양하게 작성한다.

반드시 아래 JSON 형식으로만 응답한다. 다른 텍스트, 설명, 마크다운 코드블록 없이 순수 JSON 객체 하나만 출력한다:

{
  "titles": ["제목 후보 1", "제목 후보 2", "제목 후보 3", "제목 후보 4", "제목 후보 5"],
  "scenes": [
    {"time": "00:00-00:05", "title": "인트로", "visual": "화면에 담길 내용/그래픽 지시", "narration": "실제 나레이션 대사", "caption": "화면 자막 문구(짧게)"}
  ]
}

규칙:
- narration은 실제로 소리 내어 읽을 완성된 구어체 문장으로 작성. 존댓말 사용.
- 중요한 숫자(지수, 등락률, 종목명)는 자료 내용을 정확히 반영하고 자료에 없는 수치는 지어내지 않는다.
- visual은 편집자가 바로 이해할 수 있게 구체적으로 (예: "코스피 차트 그래프 삽입", "삼성전자 로고+주가 텔롭", 특정 이미지 자료를 쓸 경우 "첨부된 ○번 이미지 활용").
- caption은 영상 자막용으로 10자 내외 핵심 키워드나 짧은 문구.
- 씬 개수는 길이에 맞게 자연스럽게 조절하되, 자료가 많으면 중요도 순으로 우선 다루고 덜 중요한 내용은 짧게 압축하거나 통합한다.
- 인트로 미포함 시 바로 본론 씬부터 시작.
- 응답 전체 분량에 여유를 두고 간결하게 작성한다. narration과 visual은 핵심만 담아 장황해지지 않게 하고, JSON은 반드시 끝까지 완결된 형태(scenes 배열과 전체 객체를 모두 닫는 괄호 포함)로 마무리한다.`;

    // build multi-part user content: interleave labeled text blocks and images
    const contentParts = [];
    contentParts.push({
      type: 'text',
      text: `아래는 오늘 모은 자료 ${materials.length}건이다. 순서는 의미가 없으니 네가 판단해서 재구성해줘.`
    });
    materials.forEach((m, idx) => {
      if (m.type === 'text') {
        contentParts.push({ type: 'text', text: `\n[자료 ${idx + 1} · 텍스트]\n${m.text}` });
      } else {
        contentParts.push({ type: 'text', text: `\n[자료 ${idx + 1} · 이미지 첨부]` });
        contentParts.push({
          type: 'image',
          source: { type: 'base64', media_type: m.mediaType, data: m.data }
        });
      }
    });

    try {
      const response = await fetch("/api/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 4096,
          system: systemPrompt,
          messages: [
            { role: "user", content: contentParts }
          ]
        })
      });

      const data = await response.json();
      if (data.error) {
        throw new Error(data.error.message || 'api_error');
      }
      const textBlocks = (data.content || []).filter(b => b.type === 'text').map(b => b.text);
      let raw = textBlocks.join('\n').trim();
      raw = raw.replace(/^```json/i, '').replace(/^```/, '').replace(/```$/, '').trim();

      const { titles, scenes, truncated } = parseResponse(raw);

      if (!Array.isArray(scenes) || scenes.length === 0) {
        throw new Error('empty');
      }

      renderResult(titles, scenes);
      lastScriptText = buildPlainText(titles, scenes);
      const truncNote = truncated ? ' · 응답이 길어 일부 축약됨' : '';
      statusLabel.textContent = `${scenes.length}개 씬 · 제목 ${titles.length}개 · 자료 ${materials.length}건 정리${truncNote}`;
      copyBtn.style.display = 'inline-block';
      if (truncated) {
        const notice = document.createElement('div');
        notice.className = 'error-state';
        notice.style.marginBottom = '16px';
        notice.textContent = '응답이 길어져 마지막 일부 씬이 잘렸어요. 자료 개수를 줄이거나 영상 길이를 짧게 설정하면 안정적으로 끝까지 생성돼요.';
        scriptOutput.prepend(notice);
      }
    } catch (err) {
      console.error(err);
      const msg = (err && err.message) ? err.message : '';
      const isNetworkError = err instanceof TypeError || /failed to fetch/i.test(msg);

      let guidance;
      if (isNetworkError) {
        guidance = '서버에 연결하지 못했어요. 인터넷 연결을 확인하고 잠시 후 다시 시도해주세요. 문제가 계속되면 사이트 운영자에게 문의해주세요.';
      } else {
        guidance = '자료 개수를 줄이거나(특히 이미지), 영상 길이를 짧게 설정한 뒤 다시 시도해주세요.';
      }

      scriptOutput.innerHTML = `<div class="error-state">스크립트 생성 중 문제가 발생했어요${msg ? ' (' + escapeHtml(msg) + ')' : ''}. ${guidance}</div>`;
      statusLabel.textContent = '오류 발생';
    } finally {
      generateBtn.disabled = false;
      generateBtn.textContent = '자료 정리해서 스크립트 생성';
    }
  }

  generateBtn.addEventListener('click', generateScript);

  copyBtn.addEventListener('click', () => {
    if (!lastScriptText) return;
    navigator.clipboard.writeText(lastScriptText).then(() => {
      const original = copyBtn.textContent;
      copyBtn.textContent = '복사됨 ✓';
      setTimeout(() => { copyBtn.textContent = original; }, 1500);
    });
  });
})();
</script>
